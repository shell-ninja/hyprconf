# ==============================================================================
# Noctalia Shell Configuration: Global Shell Settings
# Synchronized with Hyprconf dotfiles
# ==============================================================================

[shell]
font_family                 = "JetBrainsMono Nerd Font"
corner_radius_scale         = 1.4
button_borders              = true
input_borders               = true
popup_borders               = true
card_borders                = true
popup_shadows               = true
time_format                 = "{:%I:%M}"
date_format                 = "%A, %d %B"
avatar_path                 = "~/.hyprconf/hypr/icons/pc.png"
settings_show_advanced      = true
settings_window_translucent = true
show_location               = true
clipboard_enabled           = true
clipboard_keep_from_closed_apps = true
clipboard_history_max_entries   = 150
clipboard_confirm_clear_history = true
clipboard_auto_paste        = "auto"
shared_gl_context           = true
polkit_agent                = false

[shell.animation]
enabled = true
speed   = 1.0

[shell.shadow]
direction = "down"
alpha     = 0.55

[shell.panel]
transparency_mode          = "glass"
borders                    = true
shadow                     = true
list_item_background       = false
floating_layer             = "overlay"
launcher_placement         = "floating"
clipboard_placement        = "floating"
control_center_placement   = "attached"
wallpaper_placement        = "attached"
session_placement          = "attached"
polkit_placement           = "floating"
launcher_position          = "center"
clipboard_position         = "center"
polkit_position            = "center"
floating_offset            = 10
open_near_click_control_center = false
open_near_click_launcher       = false
open_near_click_clipboard      = false
open_near_click_wallpaper      = false
open_near_click_session        = false

[shell.screenshot]
save_to_file         = true
directory            = "~/Pictures"
copy_to_clipboard    = true
freeze_screen        = true
confirm_region       = false
remember_last_region = false
show_cursor          = false
pipe_to_command      = false
pipe_command         = ""


[shell.screen_corners]
enabled = true
size    = 32