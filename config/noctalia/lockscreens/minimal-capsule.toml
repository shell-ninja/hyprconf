# ==============================================================================
# Noctalia Lockscreen Preset: Minimal Capsule
# Clean, floating pill capsule positioned at the bottom. Preserves wallpaper
# and ambient blurred backdrop without visual clutter.
# ==============================================================================

[lockscreen]
enabled             = true
wallpaper           = ""
blurred_desktop     = true
blur_intensity      = 0.60
tint_intensity      = 0.25
lock_before_suspend = true
allow_empty_password= false
fingerprint         = false

[lockscreen_widgets]
enabled         = true
schema_version  = 2
widget_order    = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size      = 16
    major_interval = 4
    visible        = false

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    type             = "login_box"
    output           = "HDMI-A-1"
    placement_width  = 1920.0
    placement_height = 1080.0
    cx               = 960.0
    cy               = 890.0
    box_width        = 620.0
    box_height       = 140.0
    rotation         = 0.0

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        layout                 = "compact"
        background_color       = "surface_variant"
        background_opacity     = 0.85
        background_radius      = 28.0
        input_opacity          = 1.0
        input_radius           = 20.0
        center_password_text   = true
        show_weather           = false
        show_media             = false
        show_session_buttons   = false
        show_keyboard_layout   = true
        show_caps_lock         = true
        show_login_button      = false
        show_unlock_hint       = true
