# ==============================================================================
# Noctalia Lockscreen Preset: Media & Studio Hub
# Feature-rich lockscreen with prominent music controls, album information,
# weather badge, session action buttons, and a wide translucent glass dock.
# ==============================================================================

[lockscreen]
enabled             = true
wallpaper           = ""
blurred_desktop     = true
blur_intensity      = 0.85
tint_intensity      = 0.40
lock_before_suspend = true
allow_empty_password= false
fingerprint         = false

[lockscreen_widgets]
enabled         = true
schema_version  = 2
widget_order    = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size      = 16
    major_interval = 4
    visible        = false

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    type             = "login_box"
    output           = "HDMI-A-1"
    placement_width  = 1920.0
    placement_height = 1080.0
    cx               = 960.0
    cy               = 600.0
    box_width        = 840.0
    box_height       = 280.0
    rotation         = 0.0

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        layout                 = "regular"
        background_color       = "surface"
        background_opacity     = 0.82
        background_radius      = 26.0
        input_opacity          = 0.90
        input_radius           = 16.0
        center_password_text   = false
        show_weather           = true
        show_media             = true
        show_session_buttons   = true
        show_keyboard_layout   = true
        show_caps_lock         = true
        show_login_button      = true
        show_unlock_hint       = true
