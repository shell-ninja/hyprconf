# ==============================================================================
# Noctalia Lockscreen Preset: Bento Split
# Dual-widget layout separating the digital clock module from the
# authentication capsule for an editorial, modern desktop feel.
# ==============================================================================

[lockscreen]
enabled             = true
wallpaper           = ""
blurred_desktop     = true
blur_intensity      = 0.70
tint_intensity      = 0.30
lock_before_suspend = true
allow_empty_password= false
fingerprint         = false

[lockscreen_widgets]
enabled         = true
schema_version  = 2
widget_order    = [ "lockscreen-clock@HDMI-A-1", "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size      = 16
    major_interval = 4
    visible        = false

    [lockscreen_widgets.widget."lockscreen-clock@HDMI-A-1"]
    type             = "clock"
    output           = "HDMI-A-1"
    placement_width  = 1920.0
    placement_height = 1080.0
    cx               = 960.0
    cy               = 360.0
    box_width        = 520.0
    box_height       = 140.0
    rotation         = 0.0

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    type             = "login_box"
    output           = "HDMI-A-1"
    placement_width  = 1920.0
    placement_height = 1080.0
    cx               = 960.0
    cy               = 720.0
    box_width        = 700.0
    box_height       = 200.0
    rotation         = 0.0

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        layout                 = "regular"
        background_color       = "surface_variant"
        background_opacity     = 0.80
        background_radius      = 22.0
        input_opacity          = 1.0
        input_radius           = 14.0
        center_password_text   = true
        show_weather           = true
        show_media             = false
        show_session_buttons   = true
        show_keyboard_layout   = true
        show_caps_lock         = true
        show_login_button      = true
        show_unlock_hint       = true
