[bar.default]
auto_hide = false
background_opacity = 0.79999998211860657
border = "primary"
border_width = 0
capsule = true
capsule_fill = "primary"
capsule_foreground = "on_primary"
capsule_opacity = 0.74999998323619366
capsule_padding = 12.0
capsule_radius = 16.0
capsule_thickness = 0.69999998807907104
center = [ "power_profile", "clock", "notifications", "privacy" ]
concave_edge_corners = true
contact_shadow = false
enabled = true
end = [ "group:g2", "wallpaper", "group:g1", "network", "session" ]
hover_highlight = true
layer = "overlay"
margin_edge = 0
margin_ends = 0
margin_opposite_edge = 0
padding = 15
position = "top"
radius = 20
reserve_space = true
scale = 1.0
shadow = false
show_on_workspace_switch = true
smart_auto_hide = false
start = [ "launcher", "tray", "workspaces", "weather", "media" ]
thickness = 35
widget_spacing = 15

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "primary"
    foreground = "on_primary"
    id = "g1"
    members = [ "caffeine", "nightlight", "clipboard" ]
    opacity = 0.75
    padding = 12.0
    radius = 16.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "primary"
    foreground = "on_primary"
    id = "g2"
    members = [ "volume", "input_volume" ]
    opacity = 0.75
    padding = 16.0
    radius = 16.0

[widget.clock]
anchor = true
format = "  {:%I:%M %p}  "
timezone = "Asia/Dhaka"
tooltip_format = "{:%A, %B %d, %Y}"

[widget.control-center]
glyph = "settings"

[widget.input_volume]
font_weight = 800

[widget.launcher]
custom_image_colorize = true
glyph = "menu-4"

[widget.media]
hide_when_no_media = true
title_scroll = "always"

[widget.network]
show_label = false

[widget.privacy]
hide_inactive = true
icon_spacing = 6
type = "privacy"

[widget.session]
color = "on_error"
font_weight = 800

[widget.tray]
detached_panel = false
drawer = true
drawer_columns = 3
drawer_item_size = 20
hidden = [ "org.kde.StatusNotifierItem-1-1" ]
hide_passive = true
pinned = []

[widget.volume]
font_weight = 800

[widget.wallpaper]
glyph = "photo"

[widget.weather]
show_condition = false

[widget.workspaces]
active_pill_size = 2.0499999999999998
change_color_on_hover = true
empty_color = "surface_variant"
focused_color = "on_primary"
focused_output_only = false
hide_when_empty = true
inactive_pill_size = 1.0
label_source = "id"
labels_only_when_occupied = true
max_label_chars = 5
occupied_color = "on_primary"
pill_scale = 1.0
scale = 1.2
show_all_outputs = false
show_labels = false
style = "regular"
urgent_color = "error"
