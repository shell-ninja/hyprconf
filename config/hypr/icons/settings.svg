<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <defs>
    <!-- Background Plate Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
  </defs>

  <!-- Transparent Background / Base Squircle -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#bgGrad)" stroke="#313244" stroke-width="2" />

  <!-- Top Slider (Catppuccin Mauve) -->
  <rect x="20" y="24" width="60" height="12" rx="6" fill="#313244" />
  <rect x="20" y="24" width="15" height="12" rx="6" fill="#cba6f7" />
  <circle cx="35" cy="30" r="11" fill="#cba6f7" />
  <circle cx="35" cy="30" r="4" fill="#1e1e2e" />

  <!-- Middle Slider (Catppuccin Red) -->
  <rect x="20" y="44" width="60" height="12" rx="6" fill="#313244" />
  <rect x="20" y="44" width="50" height="12" rx="6" fill="#f38ba8" />
  <circle cx="70" cy="50" r="11" fill="#f38ba8" />
  <circle cx="70" cy="50" r="4" fill="#1e1e2e" />

  <!-- Bottom Slider (Catppuccin Peach) -->
  <rect x="20" y="64" width="60" height="12" rx="6" fill="#313244" />
  <rect x="20" y="64" width="30" height="12" rx="6" fill="#fab387" />
  <circle cx="50" cy="70" r="11" fill="#fab387" />
  <circle cx="50" cy="70" r="4" fill="#1e1e2e" />
</svg>
