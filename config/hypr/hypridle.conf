# hypridle.conf — Dynamic Island & Hyprland Idle Daemon Configuration

general {
    lock_cmd = $HOME/.hyprconf/hypr/scripts/sh/qs-lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# 5 minutes: Turn off display
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 30 minutes: Suspend machine
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
