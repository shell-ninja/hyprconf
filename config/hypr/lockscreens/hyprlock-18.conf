# ============================================================
#  hyprlock Theme 18 — "Noctalia Bento Dashboard"
#  Bento-grid aesthetic featuring modular cards:
#  - Clock & Date tile
#  - System Telemetry tile (CPU / RAM / Battery / Network)
#  - User Capsule & Password Entry tile
# ============================================================

source = ~/.config/hypr/configs/configs.conf

$fontMain = Montserrat
$fontMono = JetBrainsMono Nerd Font
$fontSans = Inter

# ── Background ──────────────────────────────────────────────
background {
    monitor =
    path = $HOME/.config/hypr/.cache/current_wallpaper.png
    blur_passes = 3
    blur_size = 8
    contrast = 0.95
    brightness = 0.70
    vibrancy = 0.20
    vibrancy_darkness = 0.30
}

# ── General ─────────────────────────────────────────────────
general {
    no_fade_in = false
    no_fade_out = false
    grace = 0
    disable_loading_bar = true
}

# ── Bento Tile 1: Clock & Calendar (Shape) ───────────────────
shape {
    monitor =
    size = 460, 260
    color = rgba(18, 14, 12, 0.60)
    rounding = 26
    border_size = 2
    border_color = $act_border
    rotate = 0
    xray = false
    position = -245, 150
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 14
    shadow_color = rgba(0, 0, 0, 0.55)
}

# ── Bento Tile 1: Time ───────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $act_border
    font_size = 68
    font_family = $fontMain ExtraBold
    position = -245, 205
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
}

# ── Bento Tile 1: Date & Day ─────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "󰸗 $(date +'%A, %d %B %Y')"
    color = $act_border
    font_size = 15
    font_family = $fontMono Medium
    position = -245, 135
    halign = center
    valign = center
}

# ── Bento Tile 1: Location / Tag ─────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "󰖕 $(curl -s -m 1 wttr.in/?format="%C,+%t" 2>/dev/null || echo "Munshiganj, 24°C")"
    color = $inact_border
    font_size = 13
    font_family = $fontMono
    position = -245, 95
    halign = center
    valign = center
}

# ── Bento Tile 2: System Telemetry (Shape) ───────────────────
shape {
    monitor =
    size = 460, 260
    color = rgba(18, 14, 12, 0.60)
    rounding = 26
    border_size = 2
    border_color = $act_border
    rotate = 0
    xray = false
    position = 245, 150
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 14
    shadow_color = rgba(0, 0, 0, 0.55)
}

# ── Bento Tile 2: Header ─────────────────────────────────────
label {
    monitor =
    text = 󰘚  SYSTEM TELEMETRY
    color = $act_border
    font_size = 13
    font_family = $fontMono Bold
    position = 65, 235
    halign = center
    valign = center
}

# ── Bento Tile 2: Battery Metric ─────────────────────────────
label {
    monitor =
    text = cmd[update:5000] echo "󰁹 Battery:   $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo "100")% [$(cat /sys/class/power_supply/BAT*/status 2>/dev/null || echo "Discharging")]"
    color = $act_border
    font_size = 13
    font_family = $fontMono
    position = 100, 190
    halign = center
    valign = center
}

# ── Bento Tile 2: RAM Metric ─────────────────────────────────
label {
    monitor =
    text = cmd[update:5000] echo "󰍛 Memory:    $(free -m | awk '/Mem:/ { printf("%.1f / %.1f GB (%.0f%%)", $3/1024, $2/1024, $3*100/$2) }')"
    color = $inact_border
    font_size = 13
    font_family = $fontMono
    position = 100, 150
    halign = center
    valign = center
}

# ── Bento Tile 2: Uptime Metric ──────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "󰅐 System Up: $(uptime -p | sed 's/up //')"
    color = $inact_border
    font_size = 13
    font_family = $fontMono
    position = 100, 110
    halign = center
    valign = center
}

# ── Bento Tile 2: Host & Layout ──────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "󰌌 Layout:    $LAYOUT    󰒋 Host: $(hostname)"
    color = $inact_border
    font_size = 12
    font_family = $fontMono
    position = 100, 70
    halign = center
    valign = center
}

# ── Bento Tile 3: Authentication Dock (Shape) ────────────────
shape {
    monitor =
    size = 950, 180
    color = rgba(18, 14, 12, 0.62)
    rounding = 26
    border_size = 2
    border_color = $act_border
    rotate = 0
    xray = false
    position = 0, -100
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 14
    shadow_color = rgba(0, 0, 0, 0.55)
}

# ── Bento Tile 3: User Avatar ────────────────────────────────
image {
    monitor =
    path = $HOME/.config/hypr/.cache/user.png
    size = 80
    rounding = -1
    border_size = 2
    border_color = $act_border
    rotate = 0
    reload_time = -1
    position = -380, -100
    halign = center
    valign = center
}

# ── Bento Tile 3: User Welcome ───────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "Welcome back, <b>$USER</b>"
    color = $act_border
    font_size = 18
    font_family = $fontSans SemiBold
    position = -200, -85
    halign = center
    valign = center
}

# ── Bento Tile 3: Subtitle ───────────────────────────────────
label {
    monitor =
    text = Noctalia Desktop Workspace
    color = $inact_border
    font_size = 12
    font_family = $fontMono
    position = -200, -115
    halign = center
    valign = center
}

# ── Bento Tile 3: Input Field ────────────────────────────────
input-field {
    monitor =
    size = 380, 48
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.22
    dots_center = true
    dots_rounding = -1
    outer_color = $act_border
    inner_color = rgba(255, 255, 255, 0.08)
    font_color = $act_border
    fade_on_empty = false
    fade_timeout = 2500
    placeholder_text = <i><span foreground="##aaaaaa">󰌾  Enter session password...</span></i>
    hide_input = false
    rounding = 24
    check_color = $act_border
    fail_color = rgba(240, 70, 70, 1)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = $act_border
    numlock_color = $act_border
    bothlock_color = $act_border
    invert_numlock = false
    swap_font_color = false
    position = 230, -100
    halign = center
    valign = center
}
