# ============================================================
#  hyprlock Theme 16 — "Noctalia Glass Card"
#  Frosted glassmorphism card centered on screen with user
#  profile, glowing accent pill, weather, system status, and
#  refined input field in Noctalia Shell's signature aesthetic.
# ============================================================

source = ~/.config/hypr/configs/configs.conf

$fontMain = Inter
$fontMono = JetBrainsMono Nerd Font

# ── Background ──────────────────────────────────────────────
background {
    monitor =
    path = $HOME/.config/hypr/.cache/current_wallpaper.png
    blur_passes = 3
    blur_size = 8
    contrast = 0.95
    brightness = 0.70
    vibrancy = 0.20
    vibrancy_darkness = 0.30
}

# ── General ─────────────────────────────────────────────────
general {
    no_fade_in = false
    no_fade_out = false
    grace = 0
    disable_loading_bar = true
}

# ── Center Glassmorphic Card (Shape) ─────────────────────────
shape {
    monitor =
    size = 420, 520
    color = rgba(18, 14, 12, 0.58)
    rounding = 28
    border_size = 2
    border_color = $act_border
    rotate = 0
    xray = false
    position = 0, 30
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 16
    shadow_color = rgba(0, 0, 0, 0.65)
}

# ── Avatar ───────────────────────────────────────────────────
image {
    monitor =
    path = $HOME/.config/hypr/.cache/user.png
    size = 96
    rounding = -1
    border_size = 3
    border_color = $act_border
    rotate = 0
    reload_time = -1
    position = 0, 215
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.4)
}

# ── Greeting ─────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "Good $(date +'%H' | awk '{h=$1; if(h<12) print "Morning"; else if(h<18) print "Afternoon"; else print "Evening"}'), <b>$USER</b>"
    color = $act_border
    font_size = 16
    font_family = $fontMain SemiBold
    position = 0, 145
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

# ── Digital Clock ────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $act_border
    font_size = 54
    font_family = $fontMain ExtraBold
    position = 0, 85
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ── Date & Calendar Pill ─────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "󰸗 $(date +'%A, %d %B %Y')"
    color = $inact_border
    font_size = 13
    font_family = $fontMono Medium
    position = 0, 42
    halign = center
    valign = center
}

# ── Status Pill Bar inside Card (Weather & Battery) ──────────
label {
    monitor =
    text = cmd[update:10000] echo "󰖕 $(curl -s -m 1 wttr.in/?format="%t" 2>/dev/null || echo "24°C")   •   󰁹 $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo "100")%   •   󰤨 Active"
    color = $inact_border
    font_size = 11
    font_family = $fontMono
    position = 0, 10
    halign = center
    valign = center
}

# ── Password Input Field ─────────────────────────────────────
input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.22
    dots_center = true
    dots_rounding = -1
    outer_color = $act_border
    inner_color = rgba(255, 255, 255, 0.08)
    font_color = $act_border
    fade_on_empty = false
    fade_timeout = 2500
    placeholder_text = <i><span foreground="##aaaaaa">󰌾  Enter Password...</span></i>
    hide_input = false
    rounding = 24
    check_color = $act_border
    fail_color = rgba(240, 70, 70, 1)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = $act_border
    numlock_color = $act_border
    bothlock_color = $act_border
    invert_numlock = false
    swap_font_color = false
    position = 0, -65
    halign = center
    valign = center
}

# ── Noctalia Branding Pill ───────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "✦ Noctalia Shell ✦"
    color = $inact_border
    font_size = 11
    font_family = $fontMono Bold
    position = 0, -170
    halign = center
    valign = center
}

# ── Bottom System Footer ─────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "󰌌 $LAYOUT  |   $(uptime -p | sed 's/up //')"
    color = $inact_border
    font_size = 12
    font_family = $fontMono
    position = 0, 25
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}
