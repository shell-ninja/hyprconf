# ============================================================
#  hyprlock Theme 19 — "Noctalia Dynamic Island & Ambient"
#  Minimalist, futuristic layout inspired by Noctalia Shell's
#  floating island bar and large ambient digital typography.
# ============================================================

source = ~/.config/hypr/configs/configs.conf

$fontMain = Montserrat
$fontMono = JetBrainsMono Nerd Font
$fontSans = Inter

# ── Background ──────────────────────────────────────────────
background {
    monitor =
    path = $HOME/.config/hypr/.cache/current_wallpaper.png
    blur_passes = 3
    blur_size = 7
    contrast = 0.90
    brightness = 0.65
    vibrancy = 0.18
    vibrancy_darkness = 0.35
}

# ── General ─────────────────────────────────────────────────
general {
    no_fade_in = false
    no_fade_out = false
    grace = 0
    disable_loading_bar = true
}

# ── Top Floating Island Pill (Shape) ─────────────────────────
shape {
    monitor =
    size = 720, 52
    color = rgba(18, 14, 12, 0.62)
    rounding = 26
    border_size = 2
    border_color = $act_border
    rotate = 0
    xray = false
    position = 0, -30
    halign = center
    valign = top
    shadow_passes = 4
    shadow_size = 14
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ── Island Content: Left Time ────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "󰅐 $(date +'%H:%M:%S')"
    color = $act_border
    font_size = 14
    font_family = $fontMono Bold
    position = -240, -45
    halign = center
    valign = top
}

# ── Island Content: Center Date ──────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "󰸗 $(date +'%A, %b %d')"
    color = $act_border
    font_size = 13
    font_family = $fontMono Medium
    position = 0, -45
    halign = center
    valign = top
}

# ── Island Content: Right Quick Status ───────────────────────
label {
    monitor =
    text = cmd[update:5000] echo "󰖕 $(curl -s -m 1 wttr.in/?format="%t" 2>/dev/null || echo "24°C")  󰁹 $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo "100")%"
    color = $inact_border
    font_size = 13
    font_family = $fontMono
    position = 230, -45
    halign = center
    valign = top
}

# ── Giant Ambient Clock (Hour) ───────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H')"
    color = $act_border
    font_size = 180
    font_family = $fontMain Black
    position = -120, 80
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 20
    shadow_color = rgba(0, 0, 0, 0.6)
}

# ── Giant Ambient Clock (Minute) ─────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%M')"
    color = $inact_border
    font_size = 180
    font_family = $fontMain Black
    position = 120, 80
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 20
    shadow_color = rgba(0, 0, 0, 0.6)
}

# ── Ambient Subtitle ─────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "<b>$USER</b>  •  NOCTALIA WORKSPACE"
    color = $act_border
    font_size = 14
    font_family = $fontMono Bold
    position = 0, -60
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# ── Bottom Floating Pill Dock (Shape) ────────────────────────
shape {
    monitor =
    size = 400, 68
    color = rgba(18, 14, 12, 0.60)
    rounding = 34
    border_size = 2
    border_color = $act_border
    rotate = 0
    xray = false
    position = 0, -150
    halign = center
    valign = center
    shadow_passes = 4
    shadow_size = 16
    shadow_color = rgba(0, 0, 0, 0.6)
}

# ── Bottom Input Field ───────────────────────────────────────
input-field {
    monitor =
    size = 360, 48
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.20
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.08)
    font_color = $act_border
    fade_on_empty = false
    fade_timeout = 2500
    placeholder_text = <i><span foreground="##aaaaaa">󰌾  Enter Password to Unlock</span></i>
    hide_input = false
    rounding = 24
    check_color = $act_border
    fail_color = rgba(240, 70, 70, 1)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = $act_border
    numlock_color = $act_border
    bothlock_color = $act_border
    invert_numlock = false
    swap_font_color = false
    position = 0, -150
    halign = center
    valign = center
}

# ── Bottom Minimalist Tag ────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "󰌌 $LAYOUT  •  Press Enter to Unlock"
    color = $inact_border
    font_size = 12
    font_family = $fontMono
    position = 0, 30
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 4
}
