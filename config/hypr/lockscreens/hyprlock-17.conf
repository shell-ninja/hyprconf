# ============================================================
#  hyprlock Theme 17 — "Noctalia Media & Status Hub"
#  Asymmetric split layout with dynamic MPRIS music player card
#  on the left, top status pill island, and sleek glass password
#  capsule on the right. Inspired by Noctalia Shell desktop widgets.
# ============================================================

source = ~/.config/hypr/configs/configs.conf

$fontMain = Montserrat
$fontMono = JetBrainsMono Nerd Font
$fontSans = Inter

# ── Background ──────────────────────────────────────────────
background {
    monitor =
    path = $HOME/.config/hypr/.cache/current_wallpaper.png
    blur_passes = 3
    blur_size = 7
    contrast = 0.95
    brightness = 0.68
    vibrancy = 0.18
    vibrancy_darkness = 0.35
}

# ── General ─────────────────────────────────────────────────
general {
    no_fade_in = false
    no_fade_out = false
    grace = 0
    disable_loading_bar = true
}

# ── Top Bar Island Container (Shape) ─────────────────────────
shape {
    monitor =
    size = 680, 48
    color = rgba(18, 14, 12, 0.60)
    rounding = 24
    border_size = 2
    border_color = $act_border
    rotate = 0
    xray = false
    position = 0, -25
    halign = center
    valign = top
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ── Top Bar: Time & Date ─────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>  $(date +'%a, %b %d')"
    color = $act_border
    font_size = 14
    font_family = $fontMono
    position = -160, -38
    halign = center
    valign = top
}

# ── Top Bar: Noctalia Indicator ──────────────────────────────
label {
    monitor =
    text = 󰣇 NOCTALIA
    color = $act_border
    font_size = 13
    font_family = $fontMono Bold
    position = 0, -38
    halign = center
    valign = top
}

# ── Top Bar: Weather & Battery ───────────────────────────────
label {
    monitor =
    text = cmd[update:5000] echo "󰖕 $(curl -s -m 1 wttr.in/?format="%t" 2>/dev/null || echo "22°C")  󰁹 $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo "100")%"
    color = $inact_border
    font_size = 13
    font_family = $fontMono
    position = 160, -38
    halign = center
    valign = top
}

# ── Left: Music Player Glass Card (Shape) ────────────────────
shape {
    monitor =
    size = 460, 240
    color = rgba(18, 14, 12, 0.62)
    rounding = 26
    border_size = 2
    border_color = $act_border
    rotate = 0
    xray = false
    position = 100, 30
    halign = left
    valign = center
    shadow_passes = 4
    shadow_size = 14
    shadow_color = rgba(0, 0, 0, 0.6)
}

# ── Left: Now Playing Header Badge ───────────────────────────
label {
    monitor =
    text = 󰝚  NOW PLAYING
    color = $act_border
    font_size = 12
    font_family = $fontMono Bold
    position = 130, 115
    halign = left
    valign = center
}

# ── Left: Track Title ────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(playerctl metadata --format '{{title}}' 2>/dev/null || echo 'No Media Playing')"
    color = $act_border
    font_size = 18
    font_family = $fontSans SemiBold
    position = 130, 75
    halign = left
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# ── Left: Artist & Album ─────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(playerctl metadata --format '{{artist}} — {{album}}' 2>/dev/null || echo 'Noctalia Audio Service')"
    color = $inact_border
    font_size = 14
    font_family = $fontSans Regular
    position = 130, 45
    halign = left
    valign = center
}

# ── Left: Media Controls Simulation / Status ─────────────────
label {
    monitor =
    text = cmd[update:1000] status=$(playerctl status 2>/dev/null || echo "Paused"); [ "$status" = "Playing" ] && echo "󰒮   󰏤   󰒭   [ $status ]" || echo "󰒮   󰐊   󰒭   [ $status ]"
    color = $act_border
    font_size = 18
    font_family = $fontMono Bold
    position = 130, -5
    halign = left
    valign = center
}

# ── Left: Progress Bar Simulation ────────────────────────────
label {
    monitor =
    text = cmd[update:2000] echo "━━━━━━━━━━━━━━━━━━━━━●━━━━━"
    color = $inact_border
    font_size = 13
    font_family = $fontMono
    position = 130, -50
    halign = left
    valign = center
}

# ── Right: Profile & Unlock Card (Shape) ─────────────────────
shape {
    monitor =
    size = 440, 360
    color = rgba(18, 14, 12, 0.62)
    rounding = 26
    border_size = 2
    border_color = $act_border
    rotate = 0
    xray = false
    position = -100, 30
    halign = right
    valign = center
    shadow_passes = 4
    shadow_size = 14
    shadow_color = rgba(0, 0, 0, 0.6)
}

# ── Right: Avatar ────────────────────────────────────────────
image {
    monitor =
    path = $HOME/.config/hypr/.cache/user.png
    size = 90
    rounding = -1
    border_size = 3
    border_color = $act_border
    rotate = 0
    reload_time = -1
    position = -275, 140
    halign = right
    valign = center
}

# ── Right: Welcome Label ─────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "Welcome back, <b>$USER</b>"
    color = $act_border
    font_size = 18
    font_family = $fontSans SemiBold
    position = -100, 50
    halign = right
    valign = center
}

# ── Right: Session Status ────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "󰌌 $LAYOUT  •  󰌾 System Locked"
    color = $inact_border
    font_size = 13
    font_family = $fontMono
    position = -100, 20
    halign = right
    valign = center
}

# ── Right: Input Field ───────────────────────────────────────
input-field {
    monitor =
    size = 340, 48
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.20
    dots_center = true
    dots_rounding = -1
    outer_color = $act_border
    inner_color = rgba(255, 255, 255, 0.08)
    font_color = $act_border
    fade_on_empty = false
    fade_timeout = 2500
    placeholder_text = <i><span foreground="##aaaaaa">󰌾  Password...</span></i>
    hide_input = false
    rounding = 24
    check_color = $act_border
    fail_color = rgba(240, 70, 70, 1)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = $act_border
    numlock_color = $act_border
    bothlock_color = $act_border
    invert_numlock = false
    swap_font_color = false
    position = -150, -55
    halign = right
    valign = center
}

# ── Bottom System Info ───────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "󰅐 Uptime: $(uptime -p | sed 's/up //')   |   Noctalia Shell Lockscreen"
    color = $inact_border
    font_size = 12
    font_family = $fontMono
    position = 0, 25
    halign = center
    valign = bottom
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}
