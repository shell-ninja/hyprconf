# ==============================================================================
# Kitty Terminal Configuration
# ==============================================================================

# --- Fonts ---
font_family      Caskaydia Cove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# --- Window Appearance & Geometry ---
initial_window_width        95c
initial_window_height       35c
window_padding_width        5
window_margin_width         5
window_border_width         2px
active_border_color         #7c71f3
inactive_border_color       #c872c9
background_opacity          0.9
dynamic_background_opacity  yes
confirm_os_window_close     0

# --- Cursor ---
cursor_trail                1
cursor_trail_decay          0.1 0.4
cursor_blink_interval       0

# --- Bell ---
enable_audio_bell           no
visual_bell_duration        0.0
window_alert_on_bell        yes
bell_on_tab                 "🔔 "

# --- Scrollback ---
scrollback_lines            10000
scrollback_pager_history_size 256
wheel_scroll_multiplier     3.0

# --- Layouts ---
# Available: splits, tall, fat, grid, horizontal, vertical, stack
enabled_layouts             splits, tall, fat, grid, horizontal, vertical, stack

# --- Tab Bar Styling ---
tab_bar_edge                top
tab_bar_style               powerline
tab_powerline_style         slanted
tab_bar_min_tabs            2
active_tab_font_style       bold
inactive_tab_font_style     normal
tab_title_template          " {index}: {title.split('/')[-1]} "
active_tab_title_template   "  {index}: {title.split('/')[-1]} "

# --- Mouse & URLs ---
url_style                   curly
open_url_with               default
detect_urls                 yes
mouse_hide_wait             3.0
strip_trailing_spaces       smart

# ==============================================================================
# Keybindings (kitty_mod = ctrl+shift)
# ==============================================================================
kitty_mod ctrl+shift

# --- Windows: Open in CWD & Splits ---
map kitty_mod+enter         launch --cwd=current
map kitty_mod+return        launch --cwd=current
map kitty_mod+\             launch --location=vsplit --cwd=current
map kitty_mod+|             launch --location=vsplit --cwd=current
map kitty_mod+-             launch --location=hsplit --cwd=current
map kitty_mod+_             launch --location=hsplit --cwd=current

# --- Windows: Navigation ---
map kitty_mod+h             first_window
map kitty_mod+l             second_window
map kitty_mod+j             third_window
map kitty_mod+[             previous_window
map kitty_mod+]             next_window
map kitty_mod+left          neighboring_window left
map kitty_mod+right         neighboring_window right
map kitty_mod+up            neighboring_window up
map kitty_mod+down          neighboring_window down

# --- Windows: Movement & Swap ---
map kitty_mod+shift+left    move_window left
map kitty_mod+shift+right   move_window right
map kitty_mod+shift+up      move_window up
map kitty_mod+shift+down    move_window down

# --- Windows: Resizing ---
map kitty_mod+r             start_resizing_window
map kitty_mod+alt+left      resize_window narrower 2
map kitty_mod+alt+right     resize_window wider 2
map kitty_mod+alt+up        resize_window taller 2
map kitty_mod+alt+down      resize_window shorter 2
map kitty_mod+alt+home      resize_window reset

# --- Windows: Zoom & Layout Toggle ---
# Stack layout maximizes/restores the current window like tmux zoom
map kitty_mod+z             toggle_layout stack
map kitty_mod+space         next_layout
map kitty_mod+w             close_window

# --- Tabs: Create, Close & Manage ---
map kitty_mod+t             launch --type=tab --cwd=current
map kitty_mod+q             close_tab
map kitty_mod+alt+t         set_tab_title

# --- Tabs: Navigation ---
map kitty_mod+page_down     next_tab
map kitty_mod+page_up       previous_tab
map kitty_mod+tab           next_tab
map kitty_mod+shift+tab     previous_tab
map kitty_mod+.             move_tab_forward
map kitty_mod+,             move_tab_backward

# --- Tabs: Direct Jump (1-9) ---
map kitty_mod+1             goto_tab 1
map kitty_mod+2             goto_tab 2
map kitty_mod+3             goto_tab 3
map kitty_mod+4             goto_tab 4
map kitty_mod+5             goto_tab 5
map kitty_mod+6             goto_tab 6
map kitty_mod+7             goto_tab 7
map kitty_mod+8             goto_tab 8
map kitty_mod+9             goto_tab 9

# --- Scrollback ---
map kitty_mod+page_up       scroll_page_up
map kitty_mod+page_down     scroll_page_down
map kitty_mod+home          scroll_home
map kitty_mod+end           scroll_end
map kitty_mod+g             show_scrollback

# --- Hints Kittens (Productivity Shortcuts) ---
# Select and open URL in browser without touching the mouse
map kitty_mod+e             open_url_with_hints
# Select path from screen and insert into prompt
map kitty_mod+p>f           kitten hints --type path --program -
# Select line from screen and insert into prompt
map kitty_mod+p>l           kitten hints --type line --program -
# Select word from screen and insert into prompt
map kitty_mod+p>w           kitten hints --type word --program -
# Select git hash and insert into prompt
map kitty_mod+p>h           kitten hints --type hash --program -
# Open selected file at line number in editor
map kitty_mod+p>n           kitten hints --type linenum

# --- Clipboard & Font Adjustments ---
map kitty_mod+c             copy_to_clipboard
map kitty_mod+v             paste_from_clipboard
map kitty_mod+equal         change_font_size all +1.0
map kitty_mod+plus          change_font_size all +1.0
map kitty_mod+minus         change_font_size all -1.0
map kitty_mod+backspace     change_font_size all 0

# --- Config Management ---
map kitty_mod+f5            load_config_file
map kitty_mod+f6            debug_config

# --- Theme Include ---
include themes/noctalia.conf
