[dock]
cross_axis_padding = 3
icon_size = 25
item_spacing = 0
main_axis_padding = 20
margin_edge = 10

[hooks]
logging_out = "~/.hyprconf/hypr/scripts/notification.sh logout"
rebooting = "~/.hyprconf/hypr/scripts/notification.sh logout"
shutting_down = "~/.hyprconf/hypr/scripts/notification.sh logout"
started = "~/.hyprconf/hypr/scripts/notification.sh sys"
wallpaper_changed = "~/.hyprconf/hypr/scripts/Wallpaper.sh set"

[hot_corners]
enabled = true

    [hot_corners.top_left]
    action = "control_center"

[location]
address = "Munshiganj, Bangladesh"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003",
    "lockscreen-widget-0000000000000004"
