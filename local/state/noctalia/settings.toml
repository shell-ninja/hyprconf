[osd.kinds]
media = false

[plugins]
enabled = [ "apex077/eyecare", "yuuto/arch-updater" ]

[shell]
avatar_path = "~/.hyprconf/hypr/.cache/shell-ninja.jpg"
screen_time_enabled = true
time_format = "{:%I:%M}"

    [shell.launcher]
    app_grid = false
    categories = false
    compact = true

        [shell.launcher.providers.emoji]
        global = true

    [shell.panel]
    borders = false
    clipboard_placement = "attached"
    floating_layer = "top"
    floating_offset = 10
    launcher_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_launcher = true
    open_near_click_session = true
    open_near_click_wallpaper = true
    polkit_placement = "attached"
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"
    wallpaper_placement = "attached"

    [shell.screenshot]
    confirm_region = true
    directory = "~/Pictures/Screenshots"

    [shell.session]
    grid_columns = 2
    show_shortcuts = false

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "ghost"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 3.0
        enabled = true
        shortcut = "2"
        variant = "ghost"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 3.0
        enabled = true
        shortcut = "3"
        variant = "ghost"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 3.0
        enabled = true
        shortcut = "4"
        variant = "destructive"

[theme]
builtin = "Catppuccin"
community_palette = "Everforest"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "cava", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "qt", "starship" ]
    enable_community_templates = false

[wallpaper]
directory = "~/.hyprconf/hypr/Wallpaper"
fill_color = "primary"
transition_duration = 600
transition_on_startup = true

    [wallpaper.default]
    path = "~/.hyprconf/hypr/Wallpaper/shell-ninja.png"

    [wallpaper.last]
    path = "~/.hyprconf/hypr/Wallpaper/shell-ninja.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "~/.hyprconf/hypr/Wallpaper/shell-ninja.png"

[widget.clock]
anchor = true
format = "{:%I:%M %p}"
timezone = "Asia/Dhaka"
vertical_format = ""

[widget.control-center]
glyph = "settings"

[widget.date]
format = "{:%d - %m - %y}"

[widget.input_volume]
font_weight = 800

[widget.launcher]
glyph = "apps-filled"

[widget.media]
hide_when_no_media = true
title_scroll = "always"

[widget.network]
show_label = false

[widget.session]
color = "on_error"
font_weight = 800

[widget.volume]
font_weight = 800

[widget.weather]
show_condition = false

[widget.widget]
color = "on_primary"
glyph = "pacman"
hide_on_empty = true
icon_color = "on_primary"
type = "yuuto/arch-updater:widget"

[widget.workspaces]
active_pill_size = 2.0499999999999998
anchor = true
inactive_pill_size = 1.0
max_label_chars = 5
occupied_color = "primary"
scale = 1.1000000000000001